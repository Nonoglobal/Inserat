<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS - Mission Archives</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Roboto Mono', monospace;
            background: #050505;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        #sidebar {
            width: 320px;
            background: #0a0a0a;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            z-index: 20;
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid #222;
            background: linear-gradient(180deg, #111 0%, #0a0a0a 100%);
        }

        .title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffaa00;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #ffaa00;
            box-shadow: 0 0 10px #ffaa00;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 10px #ffaa00; }
            50% { opacity: 0.5; box-shadow: 0 0 20px #ffaa00; }
        }

        .conflict-list {
            flex: 1;
            overflow-y: auto;
        }

        .conflict-list::-webkit-scrollbar { width: 4px; }
        .conflict-list::-webkit-scrollbar-track { background: #111; }
        .conflict-list::-webkit-scrollbar-thumb { background: #333; }

        .country-group { border-bottom: 1px solid #1a1a1a; }

        .country-header {
            padding: 12px 20px;
            background: #111;
            font-size: 11px;
            font-weight: 700;
            color: #666;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            transition: all 0.3s;
        }

        .country-header:hover { color: #ffaa00; background: #151515; }

        .conflict-item {
            padding: 10px 20px 10px 30px;
            font-size: 10px;
            color: #555;
            cursor: pointer;
            border-left: 2px solid transparent;
            transition: all 0.3s;
        }

        .conflict-item:hover {
            background: rgba(255, 170, 0, 0.05);
            color: #fff;
            border-left-color: #333;
        }

        .conflict-item.active {
            border-left-color: #ffaa00;
            background: rgba(255, 170, 0, 0.1);
            color: #ffaa00;
        }

        .conflict-year {
            font-size: 9px;
            opacity: 0.6;
            margin-right: 8px;
        }

        #main {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        #map {
            flex: 1;
            background: #000;
        }

        .overlay-ui {
            position: absolute;
            pointer-events: none;
            z-index: 1000;
        }

        .top-bar {
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .mission-info {
            background: rgba(0,0,0,0.9);
            border: 1px solid #333;
            padding: 20px;
            backdrop-filter: blur(10px);
            max-width: 380px;
            pointer-events: auto;
        }

        .mission-title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .mission-meta {
            font-size: 10px;
            color: #ffaa00;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .mission-desc {
            font-size: 11px;
            line-height: 1.6;
            color: #aaa;
            margin-bottom: 15px;
            max-height: 120px;
            overflow-y: auto;
        }

        .actors-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 9px;
            border-top: 1px solid #333;
            padding-top: 10px;
        }

        .actor-col strong { display: block; color: #666; margin-bottom: 5px; }

        .timeline-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.95);
            border: 1px solid #333;
            padding: 15px 25px;
            display: flex;
            gap: 10px;
            align-items: center;
            pointer-events: auto;
            z-index: 1000;
            border-radius: 4px;
        }

        .phase-btn {
            background: transparent;
            border: 1px solid #333;
            color: #555;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 9px;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 70px;
        }

        .phase-btn:hover { border-color: #ffaa00; color: #ffaa00; }
        .phase-btn.active { 
            background: #ffaa00; 
            color: #000; 
            border-color: #ffaa00; 
            font-weight: bold;
            transform: scale(1.05);
        }

        .play-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #ffaa00;
            color: #ffaa00;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.3s;
        }
        .play-btn:hover { background: #ffaa00; color: #000; transform: scale(1.1); }

        #close-btn {
            pointer-events: auto;
            background: rgba(0,0,0,0.8);
            border: 1px solid #333;
            color: #fff;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #close-btn:hover { background: #fff; color: #000; }

        /* NATO SYMBOLS */
        .unit-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
            transition: all 0.5s ease;
        }

        .nato-symbol {
            width: 40px;
            height: 26px;
            border: 2px solid;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .unit-size {
            font-size: 7px;
            color: #fff;
            margin-top: 1px;
            text-shadow: 0 1px 2px #000;
        }

        .unit-label {
            font-size: 8px;
            color: #fff;
            margin-top: 2px;
            text-shadow: 0 1px 3px #000;
            white-space: nowrap;
            background: rgba(0,0,0,0.6);
            padding: 1px 4px;
            border-radius: 2px;
        }

        .faction-blue { border-color: #00c8ff; color: #00c8ff; }
        .faction-red { border-color: #ff3333; color: #ff3333; }

        .unit-container.destroyed {
            opacity: 0.4;
            filter: grayscale(1);
        }
        .unit-container.destroyed::after {
            content: '✕';
            position: absolute;
            color: #ff0000;
            font-size: 30px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff0000;
        }

        .unit-container.retreating {
            animation: retreatBlink 0.5s infinite;
        }

        .unit-container.encircled {
            animation: encircledPulse 1s infinite;
        }

        .unit-container.highlight {
            animation: highlightGlow 1s infinite;
        }

        @keyframes retreatBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes encircledPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px #ff0000); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 15px #ff0000); }
        }

        @keyframes highlightGlow {
            0%, 100% { filter: drop-shadow(0 0 5px #ffcc00); }
            50% { filter: drop-shadow(0 0 20px #ffcc00); }
        }

        /* ARROWS */
        .arrow-label-text {
            background: rgba(0,0,0,0.9);
            color: #ffaa00;
            padding: 3px 8px;
            font-size: 9px;
            font-weight: bold;
            border: 1px solid #ffaa00;
            white-space: nowrap;
            text-shadow: 0 0 5px #000;
        }

        /* EFFECTS */
        .victory-star {
            font-size: 40px;
            color: #ffcc00;
            text-shadow: 0 0 20px #ffcc00, 0 0 40px #ffaa00;
            animation: victoryPulse 1s infinite;
        }

        @keyframes victoryPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.3) rotate(10deg); }
        }

        /* LEAFLET DARK */
        .leaflet-tile-pane { filter: brightness(0.35) contrast(1.3) saturate(0.7); }
        .leaflet-container { background: #000 !important; }

        /* FRONTLINE */
        @keyframes frontlineDash {
            to { stroke-dashoffset: -20; }
        }
    </style>
</head>
<body>

// =====================================================
// MAP ENGINE
// =====================================================
let map;
let currentConflict = null;
let currentPhaseIndex = 0;
let unitLayer = L.layerGroup();
let arrowLayer = L.layerGroup();
let effectsLayer = L.layerGroup();
let frontlineLayer = L.layerGroup();
let animationInterval;
let isPlaying = false;

function initMap() {
    map = L.map('map', {
        zoomControl: false,
        attributionControl: false
    }).setView([32.0, 38.0], 5);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 18
    }).addTo(map);

    unitLayer.addTo(map);
    arrowLayer.addTo(map);
    effectsLayer.addTo(map);
    frontlineLayer.addTo(map);
    
    L.control.zoom({ position: 'bottomright' }).addTo(map);
}

// =====================================================
// UNIT RENDERING
// =====================================================
function createUnitMarker(unit) {
    const isRed = unit.faction === 'red';
    const colorClass = isRed ? 'faction-red' : 'faction-blue';
    
    let symbol = '●';
    if (unit.type === 'armor') symbol = '▣';
    else if (unit.type === 'infantry') symbol = '☒';
    else if (unit.type === 'air') symbol = '▲';
    else if (unit.type === 'flag') symbol = unit.size || '⚑';

    const statusClass = unit.destroyed ? 'destroyed' : 
                       (unit.retreating ? 'retreating' : 
                       (unit.encircled ? 'encircled' : 
                       (unit.highlight ? 'highlight' : '')));

    const html = `
        <div class="unit-container ${statusClass}">
            <div class="nato-symbol ${colorClass}">
                <span>${symbol}</span>
            </div>
            ${unit.size && unit.type !== 'flag' ? `<div class="unit-size">${unit.size}</div>` : ''}
            ${unit.label ? `<div class="unit-label">${unit.label}</div>` : ''}
        </div>
    `;

    const icon = L.divIcon({
        className: 'animated-unit',
        html: html,
        iconSize: [60, 50],
        iconAnchor: [30, 25]
    });

    return L.marker(unit.pos, { icon: icon });
}

function animateUnit(marker, movement) {
    if (!movement) return;
    
    const start = marker.getLatLng();
    const end = L.latLng(movement.to);
    const duration = movement.speed || 2000;
    const startTime = Date.now();

    function animate() {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        
        const lat = start.lat + (end.lat - start.lat) * eased;
        const lng = start.lng + (end.lng - start.lng) * eased;
        
        marker.setLatLng([lat, lng]);

        if (progress < 1) {
            requestAnimationFrame(animate);
        }
    }
    requestAnimationFrame(animate);
}

// =====================================================
// ARROW RENDERING
// =====================================================
function createArrow(arrow) {
    const line = L.polyline([arrow.from, arrow.to], {
        color: arrow.color || '#00c8ff',
        weight: 4,
        opacity: 0.8,
        dashArray: '12, 6'
    });

    // Animate dash
    let offset = 0;
    const animateDash = () => {
        offset = (offset - 1) % 18;
        line.setStyle({ dashOffset: offset });
        requestAnimationFrame(animateDash);
    };
    requestAnimationFrame(animateDash);

    arrowLayer.addLayer(line);

    // Arrow head
    try {
        const decorator = L.polylineDecorator(line, {
            patterns: [{
                offset: '100%',
                repeat: 0,
                symbol: L.Symbol.arrowHead({
                    pixelSize: 12,
                    polygon: false,
                    pathOptions: { stroke: true, color: arrow.color || '#00c8ff', weight: 3 }
                })
            }]
        });
        arrowLayer.addLayer(decorator);
    } catch(e) {}

    // Label
    if (arrow.label) {
        const mid = [(arrow.from[0] + arrow.to[0]) / 2, (arrow.from[1] + arrow.to[1]) / 2];
        const labelMarker = L.marker(mid, {
            icon: L.divIcon({
                className: '',
                html: `<div class="arrow-label-text">${arrow.label}</div>`,
                iconSize: [100, 20],
                iconAnchor: [50, 10]
            })
        });
        arrowLayer.addLayer(labelMarker);
    }
}

// =====================================================
// FRONTLINE RENDERING
// =====================================================
function createFrontline(points) {
    const line = L.polyline(points, {
        color: '#ffcc00',
        weight: 3,
        opacity: 0.7,
        dashArray: '8, 8'
    });

    let offset = 0;
    const animate = () => {
        offset = (offset - 0.5) % 16;
        line.setStyle({ dashOffset: offset });
        requestAnimationFrame(animate);
    };
    requestAnimationFrame(animate);

    frontlineLayer.addLayer(line);
}

// =====================================================
// EFFECTS
// =====================================================
function createEffect(effect) {
    const pos = effect.pos;
    const delay = effect.delay || 0;

    setTimeout(() => {
        switch(effect.type) {
            case 'explosion':
            case 'airstrike':
                createExplosion(pos);
                break;
            case 'battle':
            case 'urbanBattle':
            case 'epicBattle':
                createBattle(pos, effect.type === 'epicBattle');
                break;
            case 'victory':
            case 'liberation':
                createVictory(pos);
                break;
            case 'crossing':
            case 'encirclement':
                createRing(pos, effect.type === 'encirclement' ? '#ff3333' : '#00c8ff');
                break;
            case 'dust':
                createDust(pos);
                break;
            case 'rockets':
            case 'missile':
                createRockets(pos);
                break;
        }
    }, delay);
}

function createExplosion(pos) {
    for (let i = 0; i < 3; i++) {
        setTimeout(() => {
            const circle = L.circleMarker(pos, {
                radius: 5,
                color: '#ff6600',
                fillColor: '#ffcc00',
                fillOpacity: 0.8,
                weight: 2
            });
            effectsLayer.addLayer(circle);

            let radius = 5;
            const expand = () => {
                radius += 2;
                const opacity = Math.max(0, 0.8 - radius / 50);
                circle.setRadius(radius);
                circle.setStyle({ fillOpacity: opacity, opacity: opacity });
                
                if (radius < 50) {
                    requestAnimationFrame(expand);
                } else {
                    effectsLayer.removeLayer(circle);
                }
            };
            requestAnimationFrame(expand);
        }, i * 150);
    }
}

function createBattle(pos, epic) {
    const count = epic ? 15 : 8;
    for (let i = 0; i < count; i++) {
        setTimeout(() => {
            const offset = [pos[0] + (Math.random() - 0.5) * 0.05, pos[1] + (Math.random() - 0.5) * 0.05];
            const color = Math.random() > 0.5 ? '#ff3333' : '#00c8ff';
            
            const flash = L.circleMarker(offset, {
                radius: 3 + Math.random() * 5,
                color: color,
                fillColor: color,
                fillOpacity: 0.9
            });
            effectsLayer.addLayer(flash);

            setTimeout(() => effectsLayer.removeLayer(flash), 300 + Math.random() * 400);
        }, i * 150);
    }
}

function createVictory(pos) {
    const star = L.marker(pos, {
        icon: L.divIcon({
            className: '',
            html: '<div class="victory-star">★</div>',
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        })
    });
    effectsLayer.addLayer(star);
}

function createRing(pos, color) {
    const ring = L.circle(pos, {
        radius: 15000,
        color: color,
        fillColor: color,
        fillOpacity: 0.1,
        weight: 2,
        dashArray: '8, 8'
    });
    effectsLayer.addLayer(ring);

    let offset = 0;
    const animate = () => {
        offset = (offset + 1) % 16;
        ring.setStyle({ dashOffset: offset });
        requestAnimationFrame(animate);
    };
    requestAnimationFrame(animate);
}

function createDust(pos) {
    for (let i = 0; i < 6; i++) {
        const offset = [pos[0] + (Math.random() - 0.5) * 0.1, pos[1] + (Math.random() - 0.5) * 0.1];
        const dust = L.circleMarker(offset, {
            radius: 8 + Math.random() * 12,
            color: '#c4a45f',
            fillColor: '#d4b46f',
            fillOpacity: 0.3,
            weight: 0
        });
        effectsLayer.addLayer(dust);
        setTimeout(() => effectsLayer.removeLayer(dust), 3000);
    }
}

function createRockets(pos) {
    for (let i = 0; i < 5; i++) {
        setTimeout(() => {
            createExplosion([pos[0] + (Math.random() - 0.5) * 0.05, pos[1] + (Math.random() - 0.5) * 0.05]);
        }, i * 200);
    }
}

// =====================================================
// PHASE RENDERING
// =====================================================
function renderPhase(phase) {
    unitLayer.clearLayers();
    arrowLayer.clearLayers();
    effectsLayer.clearLayers();
    frontlineLayer.clearLayers();

    // Frontlines first
    if (phase.frontline) {
        createFrontline(phase.frontline);
    }

    // Arrows
    if (phase.arrows) {
        phase.arrows.forEach((arrow, i) => {
            setTimeout(() => createArrow(arrow), i * 200);
        });
    }

    // Units
    if (phase.units) {
        phase.units.forEach((unit, i) => {
            setTimeout(() => {
                const marker = createUnitMarker(unit);
                unitLayer.addLayer(marker);

                // Entrance animation
                const el = marker.getElement();
                if (el) {
                    el.style.opacity = '0';
                    el.style.transform = 'scale(0.3)';
                    setTimeout(() => {
                        el.style.transition = 'all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
                        el.style.opacity = '1';
                        el.style.transform = 'scale(1)';
                    }, 50);
                }

                // Movement
                if (unit.movement) {
                    setTimeout(() => animateUnit(marker, unit.movement), 800);
                }
            }, i * 150);
        });
    }

    // Effects
    if (phase.effects) {
        phase.effects.forEach(effect => createEffect(effect));
    }
}

// =====================================================
// UI
// =====================================================
function renderSidebar() {
    const list = document.getElementById('conflict-list');
    list.innerHTML = '';

    for (const [country, items] of Object.entries(conflicts)) {
        const group = document.createElement('div');
        group.className = 'country-group';
        
        const header = document.createElement('div');
        header.className = 'country-header';
        header.innerHTML = `<span>${country}</span><span style="color:#ffaa00">${items.length}</span>`;
        group.appendChild(header);

        items.forEach(c => {
            const item = document.createElement('div');
            item.className = 'conflict-item';
            item.innerHTML = `<span class="conflict-year">${c.year}</span> ${c.name}`;
            item.onclick = () => loadConflict(c);
            group.appendChild(item);
        });

        list.appendChild(group);
    }
}

function loadConflict(conflict) {
    document.querySelectorAll('.conflict-item').forEach(i => i.classList.remove('active'));
    if (event && event.target) event.target.classList.add('active');

    currentConflict = conflict;
    currentPhaseIndex = 0;
    isPlaying = false;
    document.getElementById('play-btn').innerHTML = '▶';

    document.getElementById('mission-info').style.display = 'block';
    document.getElementById('m-title').textContent = conflict.name.toUpperCase();
    document.getElementById('m-meta').textContent = `${conflict.year} // ${conflict.region.toUpperCase()}`;
    document.getElementById('m-desc').textContent = conflict.desc;
    
    if (conflict.attacker) {
        document.getElementById('m-attacker').innerHTML = `
            <div style="color:#ff6666">${conflict.attacker.name}</div>
            <div style="color:#555; font-size:8px">${conflict.attacker.equipment}</div>
        `;
    }
    if (conflict.defender) {
        document.getElementById('m-defender').innerHTML = `
            <div style="color:#66ccff">${conflict.defender.name}</div>
            <div style="color:#555; font-size:8px">${conflict.defender.equipment}</div>
        `;
    }

    if (conflict.center) {
        map.flyTo(conflict.center, conflict.zoom || 7, { duration: 1.5 });
    }

    const timeline = document.getElementById('timeline-controls');
    const phaseBtns = document.getElementById('phase-buttons');
    phaseBtns.innerHTML = '';

    if (conflict.phases && conflict.phases.length > 0) {
        timeline.style.display = 'flex';
        conflict.phases.forEach((p, i) => {
            const btn = document.createElement('button');
            btn.className = 'phase-btn';
            btn.textContent = p.name;
            btn.onclick = () => goToPhase(i);
            phaseBtns.appendChild(btn);
        });
        
        setTimeout(() => goToPhase(0), 1500);
    } else {
        timeline.style.display = 'none';
        unitLayer.clearLayers();
        arrowLayer.clearLayers();
        effectsLayer.clearLayers();
        frontlineLayer.clearLayers();
    }
}

function goToPhase(index) {
    if (!currentConflict || !currentConflict.phases) return;
    currentPhaseIndex = index;

    document.querySelectorAll('.phase-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
    });

    document.getElementById('phase-counter').textContent = `${index + 1}/${currentConflict.phases.length}`;

    const phase = currentConflict.phases[index];
    
    document.getElementById('m-desc').innerHTML = `
        ${phase.date ? `<div style="color:#ffaa00; font-size:9px; margin-bottom:5px">${phase.date}</div>` : ''}
        <strong style="color:#fff">${phase.name}</strong><br>
        <span style="color:#aaa">${phase.desc}</span>
    `;

    renderPhase(phase);
}

function playAnimation() {
    if (!currentConflict || !currentConflict.phases) return;
    
    if (isPlaying) {
        isPlaying = false;
        if (animationInterval) clearInterval(animationInterval);
        document.getElementById('play-btn').innerHTML = '▶';
        return;
    }

    isPlaying = true;
    document.getElementById('play-btn').innerHTML = '⏸';
    
    let i = currentPhaseIndex;
    
    animationInterval = setInterval(() => {
        i++;
        if (i < currentConflict.phases.length) {
            goToPhase(i);
        } else {
            isPlaying = false;
            clearInterval(animationInterval);
            document.getElementById('play-btn').innerHTML = '▶';
        }
    }, 4000);
}

function closeModule() {
    if (window.parent !== window) {
        window.parent.postMessage({ type: 'CLOSE_MODULE' }, '*');
    } else {
        window.history.back();
    }
}

// =====================================================
// INIT
// =====================================================
async function init() {
    initMap();
    
    // Load custom conflicts
    if (window.ATLAS_API) {
        try {
            const saved = await ATLAS_API.getCustom('my-conflicts');
            if (saved) conflicts = saved;
        } catch(e) { console.log('No custom data'); }
    }

    renderSidebar();

    const params = new URLSearchParams(window.location.search);
    const countryParam = params.get('country');
    if (countryParam) {
        const key = Object.keys(conflicts).find(k => k.toLowerCase().includes(countryParam.toLowerCase()));
        if (key && conflicts[key].length > 0) {
            setTimeout(() => loadConflict(conflicts[key][0]), 1000);
        }
    }
}

window.saveChanges = async function() {
    if (window.ATLAS_API) {
        await ATLAS_API.saveCustom('my-conflicts', conflicts);
        alert('Data saved!');
    }
};

init();
    </script>
