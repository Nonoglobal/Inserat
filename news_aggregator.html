<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS - News Fetcher</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Roboto Mono', monospace;
            background: #000;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            margin-bottom: 20px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo-dot {
            width: 8px;
            height: 8px;
            background: #00ff00;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .logo-text {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 3px;
        }
        
        .subtitle {
            font-size: 10px;
            color: #666;
            letter-spacing: 2px;
        }
        
        .stats {
            display: flex;
            gap: 30px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #00c8ff;
        }
        
        .stat-label {
            font-size: 8px;
            color: #444;
            letter-spacing: 1px;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            background: transparent;
            border: 1px solid #333;
            color: #666;
            padding: 12px 24px;
            font-family: inherit;
            font-size: 10px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn:hover {
            border-color: #fff;
            color: #fff;
        }
        
        .btn.primary {
            border-color: #00ff00;
            color: #00ff00;
        }
        
        .btn.primary:hover {
            background: #00ff00;
            color: #000;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }
        
        .sidebar {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            padding: 15px;
        }
        
        .sidebar-title {
            font-size: 10px;
            letter-spacing: 2px;
            color: #444;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #1a1a1a;
        }
        
        .source-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            margin-bottom: 8px;
            background: #111;
            border: 1px solid #1a1a1a;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .source-item:hover {
            border-color: #333;
        }
        
        .source-item.active {
            border-color: #00ff00;
            background: rgba(0, 255, 0, 0.05);
        }
        
        .source-checkbox {
            width: 14px;
            height: 14px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #00ff00;
        }
        
        .source-item.active .source-checkbox {
            border-color: #00ff00;
        }
        
        .source-info {
            flex: 1;
        }
        
        .source-name {
            font-size: 10px;
            font-weight: 500;
            color: #ddd;
        }
        
        .source-category {
            font-size: 8px;
            color: #555;
            margin-top: 2px;
        }
        
        .source-count {
            font-size: 10px;
            color: #00c8ff;
        }
        
        .log-container {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            height: 500px;
            display: flex;
            flex-direction: column;
        }
        
        .log-header {
            padding: 12px 15px;
            border-bottom: 1px solid #1a1a1a;
            font-size: 10px;
            letter-spacing: 2px;
            color: #444;
        }
        
        .log-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 9px;
        }
        
        .log-entry {
            padding: 6px 0;
            border-bottom: 1px solid #111;
            display: flex;
            gap: 10px;
        }
        
        .log-time {
            color: #333;
            flex-shrink: 0;
        }
        
        .log-message {
            color: #666;
        }
        
        .log-message.success { color: #00ff00; }
        .log-message.error { color: #ff3333; }
        .log-message.warning { color: #ffaa00; }
        .log-message.info { color: #00c8ff; }
        
        .category-filter {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .cat-btn {
            padding: 8px 16px;
            background: #111;
            border: 1px solid #222;
            color: #555;
            font-size: 9px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .cat-btn:hover {
            border-color: #444;
            color: #888;
        }
        
        .cat-btn.active {
            border-color: #00c8ff;
            color: #00c8ff;
            background: rgba(0, 200, 255, 0.1);
        }
        
        .news-preview {
            margin-top: 20px;
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
        }
        
        .preview-header {
            padding: 12px 15px;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .preview-title {
            font-size: 10px;
            letter-spacing: 2px;
            color: #444;
        }
        
        .preview-content {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .news-item {
            display: flex;
            gap: 12px;
            padding: 15px;
            border-bottom: 1px solid #111;
            transition: background 0.2s;
        }
        
        .news-item:hover {
            background: rgba(255, 255, 255, 0.02);
        }
        
        .news-image {
            width: 80px;
            height: 60px;
            object-fit: cover;
            background: #111;
            border: 1px solid #222;
            flex-shrink: 0;
        }
        
        .news-info {
            flex: 1;
            min-width: 0;
        }
        
        .news-source {
            font-size: 8px;
            color: #00c8ff;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        
        .news-title {
            font-size: 11px;
            color: #ddd;
            line-height: 1.4;
            margin-bottom: 6px;
        }
        
        .news-meta {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .news-time {
            font-size: 8px;
            color: #444;
        }
        
        .news-category-tag {
            font-size: 7px;
            padding: 3px 6px;
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.3);
            color: #00ff00;
        }
        
        .news-category-tag.geo { background: rgba(255, 100, 0, 0.1); border-color: rgba(255, 100, 0, 0.3); color: #ff6400; }
        .news-category-tag.mil { background: rgba(255, 50, 50, 0.1); border-color: rgba(255, 50, 50, 0.3); color: #ff3333; }
        .news-category-tag.eco { background: rgba(0, 200, 255, 0.1); border-color: rgba(0, 200, 255, 0.3); color: #00c8ff; }
        .news-category-tag.tech { background: rgba(150, 50, 255, 0.1); border-color: rgba(150, 50, 255, 0.3); color: #9632ff; }
        
        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <div class="logo">
                <div class="logo-dot"></div>
                <span class="logo-text">ATLAS</span>
            </div>
            <div class="subtitle">RSS NEWS AGGREGATOR</div>
        </div>
        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="total-count">0</div>
                <div class="stat-label">TOTAL NEWS</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="source-count">0</div>
                <div class="stat-label">SOURCES</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="last-update">--:--</div>
                <div class="stat-label">LAST UPDATE</div>
            </div>
        </div>
    </div>
    
    <div class="controls">
        <button class="btn primary" id="fetch-btn" onclick="fetchAllFeeds()">▶ FETCH NEWS</button>
        <button class="btn" onclick="clearNews()">CLEAR CACHE</button>
        <button class="btn" onclick="exportNews()">EXPORT JSON</button>
        <button class="btn" onclick="window.close()">← BACK TO ATLAS</button>
    </div>
    
    <div class="main-grid">
        <div class="sidebar">
            <div class="sidebar-title">RSS SOURCES</div>
            <div id="source-list"></div>
        </div>
        
        <div>
            <div class="log-container">
                <div class="log-header">ACTIVITY LOG</div>
                <div class="log-content" id="log"></div>
            </div>
            
            <div class="category-filter">
                <button class="cat-btn active" data-cat="ALL">ALL</button>
                <button class="cat-btn" data-cat="GEOPOLITICS">GEOPOLITICS</button>
                <button class="cat-btn" data-cat="MILITARY">MILITARY</button>
                <button class="cat-btn" data-cat="ECONOMY">ECONOMY</button>
                <button class="cat-btn" data-cat="TECHNOLOGY">TECH</button>
                <button class="cat-btn" data-cat="AUSTRIA">AUSTRIA</button>
            </div>
            
            <div class="news-preview">
                <div class="preview-header">
                    <div class="preview-title">FETCHED NEWS</div>
                    <div class="preview-title" id="preview-count">0 ARTICLES</div>
                </div>
                <div class="preview-content" id="news-list"></div>
            </div>
        </div>
    </div>

    <script src="http://localhost:3001/atlas-api.js"></script>
    <script>
        // ==========================================
        // RSS FEED SOURCES - ORF und österreichische Medien
        // ==========================================
        
        const RSS_SOURCES = [
            // ORF - Österreichischer Rundfunk
            { id: 'orf-news', name: 'ORF News', url: 'https://rss.orf.at/news.xml', category: 'AUSTRIA', enabled: true },
            { id: 'orf-sport', name: 'ORF Sport', url: 'https://rss.orf.at/sport.xml', category: 'AUSTRIA', enabled: false },
            { id: 'orf-science', name: 'ORF Science', url: 'https://rss.orf.at/science.xml', category: 'TECHNOLOGY', enabled: true },
            { id: 'orf-help', name: 'ORF Help', url: 'https://rss.orf.at/help.xml', category: 'AUSTRIA', enabled: false },
            { id: 'orf-oesterreich', name: 'ORF Österreich', url: 'https://rss.orf.at/oesterreich.xml', category: 'AUSTRIA', enabled: true },
            
            // Weitere österreichische Medien
            { id: 'derstandard', name: 'Der Standard', url: 'https://www.derstandard.at/rss', category: 'AUSTRIA', enabled: true },
            { id: 'diepresse', name: 'Die Presse', url: 'https://www.diepresse.com/rss/Politik', category: 'GEOPOLITICS', enabled: true },
            { id: 'kurier', name: 'Kurier', url: 'https://kurier.at/xml/rssd', category: 'AUSTRIA', enabled: false },
            
            // Deutsche Medien
            { id: 'tagesschau', name: 'Tagesschau', url: 'https://www.tagesschau.de/xml/rss2/', category: 'GEOPOLITICS', enabled: true },
            { id: 'spiegel', name: 'Der Spiegel', url: 'https://www.spiegel.de/schlagzeilen/index.rss', category: 'GEOPOLITICS', enabled: true },
            { id: 'zeit', name: 'Die Zeit', url: 'https://newsfeed.zeit.de/index', category: 'GEOPOLITICS', enabled: false },
            
            // Internationale Medien
            { id: 'reuters', name: 'Reuters World', url: 'https://www.reutersagency.com/feed/?best-regions=europe&post_type=best', category: 'GEOPOLITICS', enabled: true },
            { id: 'bbc', name: 'BBC World', url: 'http://feeds.bbci.co.uk/news/world/rss.xml', category: 'GEOPOLITICS', enabled: true },
            { id: 'aljazeera', name: 'Al Jazeera', url: 'https://www.aljazeera.com/xml/rss/all.xml', category: 'GEOPOLITICS', enabled: false },
            
            // Wirtschaft
            { id: 'ft', name: 'Financial Times', url: 'https://www.ft.com/rss/home', category: 'ECONOMY', enabled: true },
            { id: 'handelsblatt', name: 'Handelsblatt', url: 'https://www.handelsblatt.com/contentexport/feed/top-themen', category: 'ECONOMY', enabled: false },
            
            // Tech
            { id: 'heise', name: 'Heise', url: 'https://www.heise.de/rss/heise-atom.xml', category: 'TECHNOLOGY', enabled: true },
            { id: 'golem', name: 'Golem', url: 'https://rss.golem.de/rss.php?feed=ATOM1.0', category: 'TECHNOLOGY', enabled: false },
            
            // Militär/Sicherheit
            { id: 'janes', name: 'Janes Defence', url: 'https://www.janes.com/feeds/news', category: 'MILITARY', enabled: false },
        ];
        
        // ==========================================
        // KATEGORISIERUNG
        // ==========================================
        
        const CATEGORIES = {
            'GEOPOLITICS': {
                color: 'geo',
                keywords: ['diplomacy', 'diplomat', 'treaty', 'sanction', 'embargo', 'un', 'nato', 'eu', 
                          'summit', 'bilateral', 'conflict', 'tension', 'crisis', 'border', 'territory',
                          'außenpolitik', 'gipfel', 'sanktion', 'konflikt', 'krise', 'ukraine', 'russia',
                          'china', 'usa', 'israel', 'gaza', 'iran', 'syria', 'taiwan']
            },
            'MILITARY': {
                color: 'mil',
                keywords: ['military', 'army', 'navy', 'air force', 'defense', 'weapon', 'missile', 'nuclear',
                          'war', 'combat', 'soldier', 'troops', 'attack', 'strike', 'drone', 'tank',
                          'militär', 'armee', 'waffe', 'rakete', 'krieg', 'angriff', 'bundesheer']
            },
            'ECONOMY': {
                color: 'eco',
                keywords: ['economy', 'economic', 'finance', 'market', 'stock', 'trade', 'gdp', 'inflation',
                          'recession', 'investment', 'bank', 'currency', 'dollar', 'euro', 'oil', 'gas',
                          'wirtschaft', 'börse', 'handel', 'inflation', 'ezb', 'zinsen', 'aktie']
            },
            'TECHNOLOGY': {
                color: 'tech',
                keywords: ['technology', 'tech', 'ai', 'artificial intelligence', 'cyber', 'software',
                          'digital', 'data', 'chip', 'quantum', 'space', 'satellite', 'robot',
                          'technologie', 'künstliche intelligenz', 'digital', 'computer', 'internet']
            },
            'AUSTRIA': {
                color: '',
                keywords: ['österreich', 'austria', 'wien', 'vienna', 'graz', 'salzburg', 'innsbruck',
                          'linz', 'klagenfurt', 'bundeskanzler', 'nationalrat', 'övp', 'spö', 'fpö',
                          'grüne', 'neos', 'bundesregierung']
            }
        };

        const THREAT_KEYWORDS = {
            critical: ['invasion', 'nuclear', 'war starts', 'declaration of war', 'krieg beginnt', 'atomwaffen'],
            high: ['attack', 'strike', 'missile', 'casualties', 'mobilization', 'angriff', 'rakete', 'mobilmachung'],
            medium: ['tension', 'border clash', 'sanction', 'protest', 'unrest', 'spannung', 'sanktion']
        };
        
        // ==========================================
        // STATE
        // ==========================================
        
        let allNews = [];
        let selectedCategory = 'ALL';
        
        // ==========================================
        // CORS PROXY - Notwendig für RSS Feeds
        // ==========================================
        
        // Mehrere CORS Proxies als Fallback
        const CORS_PROXIES = [
            'https://api.allorigins.win/raw?url=',
            'https://corsproxy.io/?',
            'https://api.codetabs.com/v1/proxy?quest='
        ];
        
        let currentProxyIndex = 0;
        
        function getProxyUrl(url) {
            return CORS_PROXIES[currentProxyIndex] + encodeURIComponent(url);
        }
        
        function nextProxy() {
            currentProxyIndex = (currentProxyIndex + 1) % CORS_PROXIES.length;
        }
        
        // ==========================================
        // LOGGING
        // ==========================================
        
        function log(message, type = '') {
            const logEl = document.getElementById('log');
            const time = new Date().toTimeString().substring(0, 8);
            
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `
                <span class="log-time">[${time}]</span>
                <span class="log-message ${type}">${message}</span>
            `;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
            
            // Max 100 entries
            while (logEl.children.length > 100) {
                logEl.removeChild(logEl.firstChild);
            }
        }
        
        // ==========================================
        // RSS PARSING
        // ==========================================
        
        function parseRSS(xmlText, sourceName) {
            const parser = new DOMParser();
            const xml = parser.parseFromString(xmlText, 'text/xml');
            const articles = [];
            
            // RSS 2.0 Format
            const items = xml.querySelectorAll('item');
            items.forEach(item => {
                const title = item.querySelector('title')?.textContent || '';
                const link = item.querySelector('link')?.textContent || '';
                const description = item.querySelector('description')?.textContent || '';
                const pubDate = item.querySelector('pubDate')?.textContent || '';
                
                // Bild extrahieren (verschiedene Formate)
                let image = '';
                const enclosure = item.querySelector('enclosure[type^="image"]');
                if (enclosure) {
                    image = enclosure.getAttribute('url');
                }
                const mediaContent = item.querySelector('content[url]');
                if (mediaContent) {
                    image = mediaContent.getAttribute('url');
                }
                // Fallback: Bild aus Description extrahieren
                if (!image) {
                    const imgMatch = description.match(/<img[^>]+src="([^"]+)"/);
                    if (imgMatch) image = imgMatch[1];
                }
                
                if (title && link) {
                    articles.push({
                        title: title.replace(/<[^>]*>/g, '').trim(),
                        url: link.trim(),
                        description: description.replace(/<[^>]*>/g, '').trim().substring(0, 300),
                        publishedAt: pubDate ? new Date(pubDate).toISOString() : new Date().toISOString(),
                        source: sourceName,
                        image: image
                    });
                }
            });
            
            // Atom Format Fallback
            if (articles.length === 0) {
                const entries = xml.querySelectorAll('entry');
                entries.forEach(entry => {
                    const title = entry.querySelector('title')?.textContent || '';
                    const linkEl = entry.querySelector('link[href]');
                    const link = linkEl?.getAttribute('href') || '';
                    const summary = entry.querySelector('summary, content')?.textContent || '';
                    const updated = entry.querySelector('updated, published')?.textContent || '';
                    
                    if (title && link) {
                        articles.push({
                            title: title.replace(/<[^>]*>/g, '').trim(),
                            url: link.trim(),
                            description: summary.replace(/<[^>]*>/g, '').trim().substring(0, 300),
                            publishedAt: updated ? new Date(updated).toISOString() : new Date().toISOString(),
                            source: sourceName,
                            image: ''
                        });
                    }
                });
            }
            
            return articles;
        }
        
        // ==========================================
        // KATEGORISIERUNG
        // ==========================================
        
        function analyzeArticle(article) {
            const text = `${article.title} ${article.description}`.toLowerCase();
            const categories = [];
            let threatScore = 0;

            // Threat Scoring
            if (THREAT_KEYWORDS.critical.some(k => text.includes(k))) threatScore = 9;
            else if (THREAT_KEYWORDS.high.some(k => text.includes(k))) threatScore = 6;
            else if (THREAT_KEYWORDS.medium.some(k => text.includes(k))) threatScore = 3;

            // Simple sentiment (negative keywords)
            const negativeKeywords = ['loss', 'destroy', 'fail', 'crisis', 'verlust', 'zerstört', 'krise', 'tot', 'dead'];
            const sentiment = negativeKeywords.some(k => text.includes(k)) ? 'NEGATIVE' : 'NEUTRAL';

            article.threatScore = threatScore;
            article.sentiment = sentiment;
            
            // Categorization
            for (const [cat, data] of Object.entries(CATEGORIES)) {
                for (const keyword of data.keywords) {
                    if (text.includes(keyword.toLowerCase())) {
                        categories.push(cat);
                        break;
                    }
                }
            }
            
            article.categories = categories.length > 0 ? categories : ['GENERAL'];
        }
        
        // ==========================================
        // FETCHING
        // ==========================================
        
        async function fetchFeed(source) {
            const maxRetries = CORS_PROXIES.length;
            
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const proxyUrl = getProxyUrl(source.url);
                    const response = await fetch(proxyUrl, {
                        headers: { 'Accept': 'application/rss+xml, application/xml, text/xml' }
                    });
                    
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    
                    const text = await response.text();
                    const articles = parseRSS(text, source.name);
                    
                    // Kategorisieren
                    articles.forEach(article => {                        analyzeArticle(article);
                        article.id = Date.now() + Math.random().toString(36).substr(2, 9);
                        // Source-Kategorie hinzufügen wenn nicht schon vorhanden
                        if (source.category && !article.categories.includes(source.category)) {
                            article.categories.push(source.category);
                        }
                    });
                    
                    return articles;
                } catch (e) {
                    log(`Proxy ${currentProxyIndex + 1} failed for ${source.name}: ${e.message}`, 'warning');
                    nextProxy();
                }
            }
            
            throw new Error('All proxies failed');
        }
        
        async function fetchAllFeeds() {
            const btn = document.getElementById('fetch-btn');
            btn.disabled = true;
            btn.textContent = 'FETCHING...';
            
            log('Starting RSS fetch cycle...', 'info');

            const enabledSources = RSS_SOURCES.filter(s => s.enabled);
            let totalFetched = 0;
            const newArticles = [];

            for (const source of enabledSources) {
                try { // This block simulates the NEWS INTAKE worker
                    log(`Fetching ${source.name}...`);
                    const articles = await fetchFeed(source);
                    newArticles.push(...articles);
                    totalFetched += articles.length;
                    log(`${source.name}: ${articles.length} articles`, 'success');

                    // Update source count in UI
                    updateSourceCount(source.id, articles.length);
                } catch (e) {
                    log(`${source.name}: FAILED - ${e.message}`, 'error');
                }
                
                // Kleine Pause zwischen Requests
                await new Promise(r => setTimeout(r, 500));
            }

            // This block simulates the ANALYZER worker
            log(`Analyzing ${newArticles.length} fetched articles...`, 'info');
            newArticles.forEach(article => {
                analyzeArticle(article);
            });

            // Duplikate entfernen (basierend auf URL)
            const existingUrls = new Set(allNews.map(n => n.url));
            const uniqueNew = newArticles.filter(a => !existingUrls.has(a.url));

            // Speichern
            if (uniqueNew.length > 0) {
                await syncNewsToApi(uniqueNew);
            } else {
                log('No new unique articles to save.', 'info');
            }

            // Resync with DB
            await loadNews();

            // UI aktualisieren
            updateStats();
            renderNews();
            
            log(`Fetch complete. ${uniqueNew.length} new articles added.`, 'success');
            
            btn.disabled = false;
            btn.textContent = '▶ FETCH NEWS';
        }
        
        // ==========================================
        // STORAGE
        // ==========================================

        async function syncNewsToApi(newsItems) {
            try {
                log(`Syncing ${newsItems.length} new articles to API...`, 'info');
                await ATLAS_API.addNewsBulk({ items: newsItems });
                log('Sync successful.', 'success');
            } catch (e) {
                log(`API Sync error: ${e.message}`, 'error');
            }
        }
        
        async function loadNews() {
            try {
                log('Loading news from API...', 'info');
                const response = await ATLAS_API.getNews({ limit: 500, sort: 'desc' });
                allNews = response.data || [];
                log(`Loaded ${allNews.length} articles from API.`, 'success');
            } catch (e) {
                log(`API Load error: ${e.message}`, 'error');
                allNews = [];
            }
        }
        
        function clearNews() {
            // This is now a dangerous server-side operation.
            // We will disable it for now.
            alert('This function is disabled. Clearing news must be done via the backend API directly.');
            return;

            if (confirm('DANGEROUS: Clear all news from the database? This cannot be undone.')) {
                allNews = [];
                localStorage.removeItem('atlas_categorized_news');
                updateStats();
                renderNews();
                log('Cache cleared', 'warning');
            }
        }
        
        function exportNews() {
            const blob = new Blob([JSON.stringify(allNews, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `atlas_news_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            log('News exported to JSON', 'info');
        }
        
        // ==========================================
        // UI RENDERING
        // ==========================================
        
        function renderSources() {
            const container = document.getElementById('source-list');
            container.innerHTML = '';
            
            RSS_SOURCES.forEach(source => {
                const div = document.createElement('div');
                div.className = `source-item ${source.enabled ? 'active' : ''}`;
                div.dataset.id = source.id;
                div.onclick = () => toggleSource(source.id);
                
                div.innerHTML = `
                    <div class="source-checkbox">${source.enabled ? '✓' : ''}</div>
                    <div class="source-info">
                        <div class="source-name">${source.name}</div>
                        <div class="source-category">${source.category}</div>
                    </div>
                    <div class="source-count" id="count-${source.id}">-</div>
                `;
                
                container.appendChild(div);
            });
            
            document.getElementById('source-count').textContent = RSS_SOURCES.filter(s => s.enabled).length;
        }
        
        function toggleSource(id) {
            const source = RSS_SOURCES.find(s => s.id === id);
            if (source) {
                source.enabled = !source.enabled;
                renderSources();
            }
        }
        
        function updateSourceCount(id, count) {
            const el = document.getElementById(`count-${id}`);
            if (el) el.textContent = count;
        }
        
        function updateStats() {
            document.getElementById('total-count').textContent = allNews.length;
            document.getElementById('last-update').textContent = new Date().toTimeString().substring(0, 5);
        }
        
        function renderNews() {
            const container = document.getElementById('news-list');
            
            let filtered = allNews;
            if (selectedCategory !== 'ALL') {
                filtered = allNews.filter(a => a.categories && a.categories.includes(selectedCategory));
            }
            
            document.getElementById('preview-count').textContent = `${filtered.length} ARTICLES`;
            
            if (filtered.length === 0) {
                container.innerHTML = '<div style="padding: 40px; text-align: center; color: #333;">No news available. Click FETCH NEWS to load.</div>';
                return;
            }
            
            container.innerHTML = filtered.slice(0, 100).map(article => {
                const time = new Date(article.publishedAt).toLocaleString('de-AT', { 
                    day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' 
                });
                
                const catTags = (article.categories || []).slice(0, 2).map(cat => {
                    const color = CATEGORIES[cat]?.color || '';
                    return `<span class="news-category-tag ${color}">${cat}</span>`;
                }).join('');
                
                const imgHtml = article.image 
                    ? `<img class="news-image" src="${article.image}" onerror="this.style.display='none'">`
                    : '<div class="news-image" style="background: #111; display: flex; align-items: center; justify-content: center; color: #222; font-size: 8px;">NO IMG</div>';
                
                return `
                    <div class="news-item" onclick="window.open('${article.url}', '_blank')">
                        ${imgHtml}
                        <div class="news-info">
                            <div class="news-source">● ${article.source}</div>
                            <div class="news-title">${article.title}</div>
                            <div class="news-meta">
                                <span class="news-time">${time}</span>
                                ${catTags}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // ==========================================
        // CATEGORY FILTER
        // ==========================================
        
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedCategory = btn.dataset.cat;
                renderNews();
            });
        });
        
        // ==========================================
        // INIT
        // ==========================================
        
        async function init() {
            log('ATLAS News Fetcher initialized', 'info');
            log('Using RSS feeds from ORF, Der Standard, Tagesschau, BBC, etc.', 'info');
            
            renderSources();
            await loadNews();
            updateStats();
            renderNews();
            
            // Auto-refresh every 5 minutes
            setInterval(() => {
                log('Auto-refresh triggered', 'info');
                fetchAllFeeds();
            }, 5 * 60 * 1000);
        }
        
        init();
    </script>
</body>
</html>
