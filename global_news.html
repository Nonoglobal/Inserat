<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS - Global Intelligence Feed</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Roboto Mono', monospace;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        #header {
            height: 55px;
            background: rgba(0, 0, 0, 0.95);
            border-bottom: 1px solid #151515;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            z-index: 100;
        }

        .header-left { display: flex; align-items: center; gap: 15px; }
        .header-logo { display: flex; align-items: center; gap: 10px; }
        .logo-dot { width: 6px; height: 6px; background: #00c8ff; animation: pulse 2s infinite; }
        .logo-text { font-size: 11px; font-weight: 700; letter-spacing: 3px; }
        .header-sep { width: 1px; height: 16px; background: #222; }
        .header-section { font-size: 9px; letter-spacing: 2px; color: #444; }
        
        #back-btn {
            background: transparent;
            border: 1px solid #222;
            color: #444;
            padding: 7px 14px;
            font-size: 8px;
            letter-spacing: 2px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }
        #back-btn:hover { border-color: #fff; color: #fff; }

        /* Layout */
        #main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        #sidebar {
            width: 250px;
            background: #050505;
            border-right: 1px solid #151515;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header { padding: 20px; border-bottom: 1px solid #151515; }
        .sidebar-title { font-size: 9px; font-weight: 700; letter-spacing: 2px; color: #444; margin-bottom: 15px; }
        
        .category-list { flex: 1; overflow-y: auto; padding: 10px 0; }
        .category-item {
            padding: 12px 20px;
            cursor: pointer;
            border-left: 2px solid transparent;
            font-size: 10px;
            color: #666;
            letter-spacing: 1px;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
        }
        .category-item:hover { background: rgba(255, 255, 255, 0.02); color: #fff; }
        .category-item.active { background: rgba(0, 200, 255, 0.05); border-left-color: #00c8ff; color: #00c8ff; }
        .category-count { font-size: 9px; opacity: 0.5; }

        /* Content */
        #content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0a0a0a;
        }

        #news-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .news-card {
            background: #0f0f0f;
            border: 1px solid #1a1a1a;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            gap: 20px;
        }
        .news-card:hover { border-color: #333; background: #141414; }
        
        .news-img {
            width: 120px;
            height: 80px;
            background: #000;
            object-fit: cover;
            border: 1px solid #222;
        }
        
        .news-info { flex: 1; }
        
        .news-meta {
            display: flex;
            gap: 15px;
            font-size: 8px;
            color: #555;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .news-source { color: #00c8ff; font-weight: 700; }
        
        .news-title {
            font-size: 14px;
            font-weight: 500;
            color: #ddd;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        
        .news-preview {
            font-size: 10px;
            color: #888;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Detail View (Modal-like overlay or split) */
        #detail-view {
            position: absolute;
            top: 0; right: 0; bottom: 0;
            width: 500px;
            background: #080808;
            border-left: 1px solid #222;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 50;
            display: flex;
            flex-direction: column;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }
        #detail-view.active { transform: translateX(0); }

        .detail-header {
            padding: 20px;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .detail-close {
            background: none;
            border: 1px solid #333;
            color: #666;
            width: 30px; height: 30px;
            cursor: pointer;
        }
        .detail-close:hover { color: #fff; border-color: #fff; }

        .detail-content {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .detail-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            margin-bottom: 20px;
            border: 1px solid #222;
        }

        .detail-title {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .detail-text {
            font-size: 12px;
            color: #aaa;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .detail-actions {
            padding: 20px;
            border-top: 1px solid #222;
            text-align: right;
        }

        .action-btn {
            background: transparent;
            border: 1px solid #00c8ff;
            color: #00c8ff;
            padding: 10px 20px;
            font-size: 10px;
            letter-spacing: 2px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .action-btn:hover { background: #00c8ff; color: #000; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>
    <header id="header">
        <div class="header-left">
            <div class="header-logo">
                <div class="logo-dot"></div>
                <span class="logo-text">ATLAS</span>
            </div>
            <div class="header-sep"></div>
            <span class="header-section">GLOBAL INTELLIGENCE FEED</span>
        </div>
        <button id="back-btn" onclick="goBack()">← RETURN</button>
    </header>

    <div id="main">
        <aside id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">CATEGORIES</div>
            </div>
            <div class="category-list" id="category-list">
                <div class="category-item active" onclick="filterNews('ALL')">
                    <span>ALL SOURCES</span>
                    <span class="category-count" id="count-all">0</span>
                </div>
                <div class="category-item" onclick="filterNews('GEOPOLITICS')">
                    <span>GEOPOLITICS</span>
                    <span class="category-count" id="count-geo">0</span>
                </div>
                <div class="category-item" onclick="filterNews('MILITARY')">
                    <span>MILITARY</span>
                    <span class="category-count" id="count-mil">0</span>
                </div>
                <div class="category-item" onclick="filterNews('ECONOMY')">
                    <span>ECONOMY</span>
                    <span class="category-count" id="count-eco">0</span>
                </div>
                <div class="category-item" onclick="filterNews('TECHNOLOGY')">
                    <span>TECHNOLOGY</span>
                    <span class="category-count" id="count-tech">0</span>
                </div>
            </div>
        </aside>

        <div id="content">
            <div id="news-list">
                <!-- News items will be injected here -->
            </div>
        </div>

        <div id="detail-view">
            <div class="detail-header">
                <span style="font-size:10px; letter-spacing:2px; color:#00c8ff;">INTELLIGENCE REPORT</span>
                <button class="detail-close" onclick="closeDetail()">×</button>
            </div>
            <div class="detail-content">
                <img id="detail-img" src="" class="detail-img" style="display:none">
                <div class="news-meta" style="margin-bottom:20px;">
                    <span class="news-source" id="detail-source">SOURCE</span>
                    <span id="detail-date">DATE</span>
                </div>
                <div class="detail-title" id="detail-title">Title</div>
                <div class="detail-text" id="detail-text">Content</div>
            </div>
            <div class="detail-actions">
                <a href="#" target="_blank" id="detail-link" class="action-btn">OPEN SOURCE</a>
            </div>
        </div>
    </div>

    <script src="http://localhost:3001/atlas-api.js"></script>
    <script>
        let allNews = [];
        let currentCategory = 'ALL';

        async function init() {            await loadNews();
            
            // Auto-refresh every minute
            setInterval(async () => {
                await loadNews();
            }, 60000);
        }

        async function loadNews() {
            try {
                const response = await ATLAS_API.getNews({ limit: 500, sort: 'desc' });
                if (response.status === 'success' && response.data) {
                    allNews = response.data;
                    // Map to expected format if necessary (looks compatible)
                    allNews.forEach(item => {
                        item.publishedAt = item.publishedAt || item.date;
                    });
                    updateCounts();
                    renderNews();
                } else {
                    document.getElementById('news-list').innerHTML = '<div style="padding:40px; text-align:center; color:#444; font-size:12px;">NO DATA STREAM AVAILABLE</div>';
                }
            } catch(e) {
                console.error("Error loading news", e);
            }
        }

        function updateCounts() {
            document.getElementById('count-all').textContent = allNews.length;
            
            const cats = ['GEOPOLITICS', 'MILITARY', 'ECONOMY', 'TECHNOLOGY'];
            cats.forEach(cat => { 
                const count = allNews.filter(n => n.categories && n.categories.includes(cat)).length;
                const el = document.getElementById('count-' + (cat === 'GEOPOLITICS' ? 'geo' : cat === 'MILITARY' ? 'mil' : cat === 'ECONOMY' ? 'eco' : 'tech'));
                if (el) el.textContent = count;
            });
        }

        function filterNews(category) {
            currentCategory = category;
            
            // Update UI
            document.querySelectorAll('.category-item').forEach(el => {
                el.classList.remove('active');
                if (el.textContent.includes(category === 'ALL' ? 'ALL SOURCES' : category)) {
                    el.classList.add('active');
                }
            });
            
            renderNews();
        }

        function renderNews() {
            const container = document.getElementById('news-list');
            let filtered = allNews;
            
            if (currentCategory !== 'ALL') {
                filtered = allNews.filter(n => n.categories && n.categories.includes(currentCategory));
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '<div style="padding:40px; text-align:center; color:#444; font-size:12px;">NO REPORTS IN THIS CATEGORY</div>';
                return;
            }
            
            let html = '';
            filtered.forEach((item, index) => {
                // Find original index for click handler
                const originalIndex = allNews.indexOf(item);
                const date = new Date(item.publishedAt || item.date).toLocaleString();
                const imgHtml = item.image ? `<img src="${item.image}" class="news-img" onerror="this.style.display='none'">` : `<div class="news-img" style="display:flex;align-items:center;justify-content:center;color:#333;font-size:20px;">◇</div>`;
                
                html += `
                    <div class="news-card" onclick="openDetail(${originalIndex})">
                        ${imgHtml}
                        <div class="news-info">
                            <div class="news-meta">
                                <span class="news-source">${item.source}</span>
                                <span>${date}</span>
                            </div>
                            <div class="news-title">${item.title}</div>
                            <div class="news-preview">${item.description || 'No description available.'}</div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        function openDetail(index) {
            const item = allNews[index];
            if (!item) return;
            
            document.getElementById('detail-source').textContent = item.source;
            document.getElementById('detail-date').textContent = new Date(item.publishedAt || item.date).toLocaleString();
            document.getElementById('detail-title').textContent = item.title;
            document.getElementById('detail-text').textContent = item.description || 'No content available.';
            document.getElementById('detail-link').href = item.url || item.link;
            
            const img = document.getElementById('detail-img');
            if (item.image) {
                img.src = item.image;
                img.style.display = 'block';
            } else {
                img.style.display = 'none';
            }
            
            document.getElementById('detail-view').classList.add('active');
        }

        function closeDetail() {
            document.getElementById('detail-view').classList.remove('active');
        }

        function goBack() {
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'CLOSE_MODULE' }, '*');
            } else {
                window.history.back();
            }
        }
        
        // ESC key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (document.getElementById('detail-view').classList.contains('active')) {
                    closeDetail();
                } else {
                    goBack();
                }
            }
        });

        init();
    </script>
</body>
</html>
